[package]
name = "shellcheck-rust"
version.workspace = true
edition.workspace = true
description = "A Rust port of ShellCheck (work in progress)"
license = "GPL-3.0-or-later"
repository = "https://github.com/OWNER/shellcheck-rust"
homepage = "https://github.com/OWNER/shellcheck-rust"
documentation = "https://github.com/OWNER/shellcheck-rust/blob/main/docs/install.md"
readme = "../../README.md"
keywords = ["shell", "shellcheck", "bash", "lint", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "shellcheck-rust"
path = "src/main.rs"

[dependencies]
shellcheck-core = { path = "../core" }
shellcheck-analyzer = { path = "../analyzer" }
shellcheck-formatter = { path = "../formatter" }
# Linked only so the linkme-registered checks end up in the binary.
shellcheck-checks = { path = "../checks" }
shellcheck-checker = { path = "../checker" }
