[package]
name = "shelllint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "A Rust port of ShellCheck (work in progress)"
documentation = "https://github.com/DevanshChoubey/shelllint/blob/main/docs/install.md"

[[bin]]
name = "shelllint"
path = "src/main.rs"
# The library facade (crates/shelllint) documents under this name.
doc = false

[dependencies]
shelllint-core.workspace = true
shelllint-analyzer.workspace = true
shelllint-formatter.workspace = true
shelllint-checker.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
