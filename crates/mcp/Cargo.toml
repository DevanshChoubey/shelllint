[package]
name = "shellcheck-mcp"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "MCP (Model Context Protocol) server exposing the ShellCheck port to AI coding agents"

[lib]
path = "src/lib.rs"

[[bin]]
name = "shellcheck-rust-mcp"
path = "src/main.rs"

[dependencies]
serde_json = "1"
shellcheck-core = { path = "../core" }
shellcheck-analyzer = { path = "../analyzer" }
shellcheck-checker = { path = "../checker" }
shellcheck-formatter = { path = "../formatter" }
