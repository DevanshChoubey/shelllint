[package]
name = "shelllint-lib"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Embeddable library facade for the shelllint linter (a Rust port of ShellCheck)"

[lib]
name = "shelllint"
path = "src/lib.rs"

[features]
default = []
serde = ["dep:serde"]

[dependencies]
shelllint-core.workspace = true
shelllint-analyzer.workspace = true
shelllint-checker.workspace = true
shelllint-checks.workspace = true
shelllint-formatter.workspace = true
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
