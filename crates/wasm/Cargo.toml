[package]
name = "shellcheck-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "WebAssembly bindings for shellcheck-rust (browser playground)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shellcheck-core.workspace = true
shellcheck-checker.workspace = true
shellcheck-checks.workspace = true
shellcheck-formatter.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen-cli version in scripts/build-wasm.sh.
wasm-bindgen = "=0.2.130"
