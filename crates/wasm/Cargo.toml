[package]
name = "shellcheck-wasm"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "WebAssembly bindings for shellcheck-rust (browser playground)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shellcheck-core = { path = "../core" }
shellcheck-checker = { path = "../checker" }
shellcheck-checks = { path = "../checks" }
shellcheck-formatter = { path = "../formatter" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen-cli version in scripts/build-wasm.sh.
wasm-bindgen = "=0.2.130"
