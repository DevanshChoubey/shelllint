[package]
name = "shelllint-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "WebAssembly bindings for shelllint (browser playground)"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
shelllint-core.workspace = true
shelllint-checker.workspace = true
shelllint-checks.workspace = true
shelllint-formatter.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Must match the wasm-bindgen-cli version in scripts/build-wasm.sh.
wasm-bindgen = "=0.2.130"

[lints]
workspace = true
