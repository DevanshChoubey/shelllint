[package]
name = "shellcheck-lsp"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-or-later"
description = "Language Server (LSP over stdio) for shellcheck-rust"

[lib]
name = "shellcheck_lsp"
path = "src/lib.rs"

[[bin]]
name = "shellcheck-rust-lsp"
path = "src/main.rs"

[dependencies]
shellcheck-core = { path = "../core" }
shellcheck-checker = { path = "../checker" }
lsp-server = "0.7"
lsp-types = "0.95"
crossbeam-channel = "0.5"
serde = "1"
serde_json = "1"

