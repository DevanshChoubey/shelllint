[package]
name = "shelllint-lsp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Language Server (LSP over stdio) for shelllint"

[lib]
name = "shelllint_lsp"
path = "src/lib.rs"

[[bin]]
name = "shelllint-lsp"
path = "src/main.rs"

[dependencies]
shelllint-core.workspace = true
shelllint-checker.workspace = true
shelllint-parser.workspace = true
lsp-server = "0.10"
lsp-types = "0.95"
crossbeam-channel = "0.5"
serde = "1"
serde_json = "1"


[lints]
workspace = true
