[package]
name = "shellcheck-checker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
shellcheck-core = { path = "../core" }
shellcheck-parser = { path = "../parser" }
shellcheck-analyzer = { path = "../analyzer" }
shellcheck-checks = { path = "../checks" }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "pipeline"
harness = false
