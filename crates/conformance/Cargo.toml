[package]
name = "shelllint-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Conformance harness comparing shelllint against ShellCheck's own tests and outputs"
publish = false

[features]
default = ["parser", "analyzer", "checker"]
# Each hook task (3, 13, 15) flipped its feature on.
parser = ["dep:shelllint-parser"]
# The check hooks run entries of the checks crate's CHECKS registry.
analyzer = ["dep:shelllint-analyzer", "dep:shelllint-checks"]
checker = ["dep:shelllint-checker", "dep:shelllint-core", "dep:shelllint-formatter"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelllint-parser = { workspace = true, optional = true }
shelllint-analyzer = { workspace = true, optional = true }
shelllint-checks = { workspace = true, optional = true }
shelllint-checker = { workspace = true, optional = true }
shelllint-core = { workspace = true, optional = true }
shelllint-formatter = { workspace = true, optional = true }

[lints]
workspace = true
