[package]
name = "shellcheck-conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Conformance harness comparing shellcheck-rust against ShellCheck's own tests and outputs"
publish = false

[features]
default = ["parser", "analyzer", "checker"]
# Each hook task (3, 13, 15) flipped its feature on.
parser = ["dep:shellcheck-parser"]
# The check hooks run entries of the checks crate's CHECKS registry.
analyzer = ["dep:shellcheck-analyzer", "dep:shellcheck-checks"]
checker = ["dep:shellcheck-checker", "dep:shellcheck-core", "dep:shellcheck-formatter"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellcheck-parser = { workspace = true, optional = true }
shellcheck-analyzer = { workspace = true, optional = true }
shellcheck-checks = { workspace = true, optional = true }
shellcheck-checker = { workspace = true, optional = true }
shellcheck-core = { workspace = true, optional = true }
shellcheck-formatter = { workspace = true, optional = true }

[lints]
workspace = true
