[package]
name = "shellcheck-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = []
# Each hook task (3, 13, 15) flips its feature on.
parser = ["dep:shellcheck-parser"]
analyzer = ["dep:shellcheck-analyzer"]
checker = ["dep:shellcheck-checker", "dep:shellcheck-core"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellcheck-parser = { path = "../parser", optional = true }
shellcheck-analyzer = { path = "../analyzer", optional = true }
shellcheck-checker = { path = "../checker", optional = true }
shellcheck-core = { path = "../core", optional = true }
