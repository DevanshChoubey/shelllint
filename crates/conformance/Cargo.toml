[package]
name = "shellcheck-conformance"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["parser", "analyzer", "checker"]
# Each hook task (3, 13, 15) flipped its feature on.
parser = ["dep:shellcheck-parser"]
# The checks register themselves into the analyzer's CHECKS slice (linkme),
# so the crate holding them must be linked too.
analyzer = ["dep:shellcheck-analyzer", "dep:shellcheck-checks"]
checker = ["dep:shellcheck-checker", "dep:shellcheck-core", "dep:shellcheck-formatter"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shellcheck-parser = { path = "../parser", optional = true }
shellcheck-analyzer = { path = "../analyzer", optional = true }
shellcheck-checks = { path = "../checks", optional = true }
shellcheck-checker = { path = "../checker", optional = true }
shellcheck-core = { path = "../core", optional = true }
shellcheck-formatter = { path = "../formatter", optional = true }
