# SPDX-License-Identifier: GPL-3.0-or-later
# Pinned real-world shell repositories for bench/fetch.sh and bench/run_real.sh.
# Every commit is a full 40-hex SHA resolved from the default-branch HEAD on
# 2026-11-06. To re-pin, change `commit` and rerun bench/fetch.sh.
#
# Only sh/bash/dash/ksh files are checked (by extension or shebang), so
# zsh-only projects such as ohmyzsh are left out: both tools would report
# "unsupported shell" for nearly every file and the comparison would be empty.
#
# `exclude` is a list of path prefixes relative to the repo root.

[[repo]]
name = "nvm"
url = "https://github.com/nvm-sh/nvm.git"
commit = "4e8758a801eea9479b32a904f31093e410ddaba4"
exclude = []

