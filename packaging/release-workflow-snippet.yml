# Release-build job for shellcheck-rust, for the CI owner to merge into the
# release workflow. This file is NOT a runnable workflow: it is a `jobs:`
# fragment describing what the release needs. Do not copy it into
# .github/workflows/ unchanged.
#
# Inputs: a tag `v<VERSION>` (e.g. v0.0.1). Outputs: one archive per target
# named exactly as action.yml, packaging/homebrew and packaging/aur expect:
#   shellcheck-rust-v<VERSION>-<target>.tar.gz   (zip for windows)
#   SHA256SUMS                                    (sha256 of every archive)
# Each archive holds the binary `shellcheck-rust` (`.exe` on Windows) plus LICENSE.
#
# Required by downstream packaging:
#   - Linux targets are static musl builds, so they run on any distro.
#   - Release profile is the workspace default (lto = true, codegen-units = 1).

jobs:
  release-build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 static musl: native build on an x86_64 Linux runner.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            build: native
          # aarch64 static musl: cross-compiled with `cross` (uses Docker).
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            archive: tar.gz
            build: cross
          # macOS Intel and Apple Silicon: native builds on the matching runner.
          - target: x86_64-apple-darwin
            runner: macos-13
            archive: tar.gz
            build: native
          - target: aarch64-apple-darwin
            runner: macos-14
            archive: tar.gz
            build: native
          # Windows MSVC: native build on the Windows runner, zipped.
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            archive: zip
            build: native
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TERM_COLOR: always
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install cross
        if: matrix.build == 'cross'
        run: cargo install cross --locked
      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          # Memory cap as the other jobs use: one build at a time, four jobs.
          if [ "${{ matrix.build }}" = cross ]; then
            cross build --release --locked -p shellcheck-rust --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p shellcheck-rust --target "${{ matrix.target }}"
          fi
      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          v="${VERSION#v}"
          name="shellcheck-rust-v${v}-${{ matrix.target }}"
          bin="target/${{ matrix.target }}/release/shellcheck-rust"
          mkdir -p "dist/$name"
          cp LICENSE "dist/$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp "${bin}.exe" "dist/$name/"
            (cd dist && 7z a "$name.zip" "$name" >/dev/null)
          else
            cp "$bin" "dist/$name/"
            strip "dist/$name/shellcheck-rust" 2>/dev/null || true
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -rf "dist/$name"
      - uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.target }}
          path: dist/*.{tar.gz,zip}
          if-no-files-found: error

  release-publish-assets:
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - name: Checksums and version-less aliases
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum shellcheck-rust-v*.tar.gz shellcheck-rust-v*.zip > SHA256SUMS
          # Version-less copies so `releases/latest/download/...` works (action.yml version: latest).
          for f in shellcheck-rust-v*; do
            [ -f "$f" ] || continue
            v="$(echo "$f" | sed -E 's/^shellcheck-rust-v([^-]+)-(.*)\.(tar\.gz|zip)$/\1/')"
            cp "$f" "${f/shellcheck-rust-v$v/shellcheck-rust-latest}"
          done
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"

  docker-image:
    # Multi-arch static image from the repo Dockerfile, for the pre-commit docker hook.
    needs: release-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shellcheck-rust:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/shellcheck-rust:latest
