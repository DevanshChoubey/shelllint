# pre-commit hooks for shelllint. Consume from another repo with:
#
#   repos:
#     - repo: https://github.com/DevanshChoubey/shelllint
#       rev: v0.1.0
#       hooks:
#         - id: shelllint          # runs shelllint from your PATH
#         # or
#         - id: shelllint-docker   # pulls the static image (needs Docker)
#
# `shelllint` is a `language: system` hook: install the binary first
# (a release archive, Homebrew, AUR, or `cargo install shelllint`).
# Both hooks run with the repo's default settings; add `args: [...]` in the
# consumer config to pass flags such as `--severity=warning`.

- id: shelllint
  name: shelllint
  description: Lint shell scripts with shelllint (a Rust port of ShellCheck), installed on PATH.
  entry: shelllint
  language: system
  types: [shell]
  require_serial: true
  args: [--format=gcc]

- id: shelllint-docker
  name: shelllint (docker)
  description: Lint shell scripts with the static shelllint image; no local install needed.
  # Image is built from the repo Dockerfile and pushed by the release
  # workflow's docker-image job (ghcr.io names are lowercase).
  entry: ghcr.io/devanshchoubey/shelllint:0.1.0
  language: docker_image
  types: [shell]
  require_serial: true
  args: [--format=gcc]

# Builds shelllint with cargo on first use (needs a Rust toolchain; slower than
# the system hook). The binary is installed into the hook's own environment.
- id: shelllint-rust
  name: shelllint (cargo)
  description: Lint shell scripts with shelllint, built from source by pre-commit using cargo.
  entry: shelllint
  language: rust
  types: [shell]
  require_serial: true
  args: [--format=gcc]
