[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
description = "An unofficial Rust port of ShellCheck, the shell script static analysis tool"
repository = "https://github.com/DevanshChoubey/shellcheck-rust"
homepage = "https://github.com/DevanshChoubey/shellcheck-rust"
readme = "README.md"
keywords = ["shellcheck", "shell", "bash", "linter", "static-analysis"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.88"

[profile.release]
lto = true
codegen-units = 1

# The pathological-input tests (crates/conformance/tests/pathological.rs)
# must finish in 10 s under `cargo test`; unoptimised, the parser takes
# ~15-20 s on 50,000 lines. Optimise the pipeline crates in dev/test builds.
[profile.dev.package.shellcheck-parser]
opt-level = 2
[profile.dev.package.shellcheck-core]
opt-level = 2
[profile.dev.package.shellcheck-analyzer]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
